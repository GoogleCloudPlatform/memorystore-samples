name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test Maven modules
        run: |
          failed=0
          while IFS= read -r pom; do
            echo "::group::Testing ${pom}"
            if ! mvn -B -ntp test -f "${pom}"; then
              echo "::error file=${pom}::Maven build/test failed for ${pom}"
              failed=1
            fi
            echo "::endgroup::"
          done < <(git ls-files '*pom.xml')
          exit "${failed}"

      - name: Run JavaScript unit tests
        run: |
          mapfile -t test_files < <(git ls-files '*.test.js' '*.test.mjs')
          if (( ${#test_files[@]} == 0 )); then
            echo "No JavaScript test files tracked yet."
            exit 0
          fi
          node --test "${test_files[@]}"
